---
# file: roles/yavdr-xorg/tasks/setup-xorg.yml

- name: Apt | remove obsolete packages for xorg
  ansible.builtin.apt:
    name:
      - xlogin
      - yavdr-xorg
    state: absent

- name: Create directories for systemd drop-in files
  ansible.builtin.file:
    dest: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "/etc/systemd/system/vdr.service.d/"
    - "/etc/systemd/system/user@{{ vdr.uid }}.service.d/"
    - "/etc/X11/xorg.conf.d/"
    - "{{ vdr.home }}/.config/systemd/user/"

- name: Create yavdr-xorg
  ansible.builtin.template:
    src: templates/systemd/system/yavdr-xorg.service.j2
    dest: "/lib/systemd/system/yavdr-xorg.service"
    mode: "0644"
  notify: ["Reload Units"]

# - name: Systemd-Drop-In | add dependency to X-server for vdr.service
#   ansible.builtin.template:
#     src: templates/vdr-xorg.conf
#     dest: /etc/systemd/system/vdr.service.d/vdr-xorg.conf
#     mode: "0644"
#   notify: ["Reload Units"]
- name: Remove existing /etc/systemd/system/vdr.service.d/vdr-xorg.conf
  ansible.builtin.file:
    path: /etc/systemd/system/vdr.service.d/vdr-xorg.conf
    state: absent

- name: VDR-config | create softhddevice.conf if it doesn't exist yet
  ansible.builtin.lineinfile:
    path: /etc/vdr/conf.avail/softhddevice.conf
    create: true
    state: present
    line: "[softhddevice]"

- name: VDR-config | start softhddevice detached and set audio to pulseaudio
  ansible.builtin.lineinfile:
    path: /etc/vdr/conf.avail/softhddevice.conf
    line: "{{ item }}"
  loop:
    - "-D"
    - "-w alsa-driver-broken"
    # - '-a pulse' # do we need this with our existing asound.conf?

- name: VDR-config | set vaapi video output method for softhddevice
  ansible.builtin.lineinfile:
    path: /etc/vdr/conf.avail/softhddevice.conf
    state: present
    regexp: "^-v .*"
    line: "-v {{ softhddevice_vaapi_output_method | default('va-api-egl') }}"
  when: (intel_detected or amd_detected or (nvidia_detected and not nvidia_driver_installed))

- name: VDR-config | set nvdec-egl video output method for softhddevice
  ansible.builtin.lineinfile:
    path: /etc/vdr/conf.avail/softhddevice.conf
    state: present
    regexp: "^-v .*"
    line: "-v nvdec-egl"
  when: (ansible_facts.nvidia_detected and nvidia_driver_installed)

- name: Add a login shell for the user vdr
  ansible.builtin.user:
    name: "{{ vdr.user }}"
    shell: "/bin/bash"
    state: present
    uid: "{{ vdr.uid }}"
    groups: "{{ vdr.group }}"
    append: true

- name: Apt | install packages for xorg
  ansible.builtin.apt:
    name:
      - edid-decode
      - python3-dbus2vdr
      - python3-dotenv
      - python3-pydantic
      - python3-yavdr-frontend
      - tmux
      - feh
      - xdg-utils
      - openbox
      - read-edid
      - xserver-xorg-input-all
      - xserver-xorg-video-all
      - dbus-user-session
      - xorg
    state: present

- name: Apt | install intel xorg driver
  ansible.builtin.apt:
    name:
      - xserver-xorg-video-intel
    state: present
  when: intel_driver == 'intel'

- name: Set the vdr instance id for yavdr-frontend
  yaml_edit:
    path: /etc/yavdr-frontend/config.yml
    key: vdr.id
    int_value: "{{ vdr.instance_id | default(0) }}"

- name: YaVDR frontend | set attach on startup to "{{ yavdr_frontend.attach_on_startup }}"
  yaml_edit:
    path: /etc/yavdr-frontend/config.yml
    key: vdr.attach_on_startup
    str_value: "{{ yavdr_frontend.attach_on_startup }}"

- name: Apt | install packages for Intel IGP
  ansible.builtin.apt:
    name:
      - i965-va-driver-shaders
      - intel-media-va-driver-non-free
      - libgl1-amber-dri
    state: present
  when: intel_detected | bool and not nvidia_detected | bool

- name: Apt | install packages for AMD GPUs
  ansible.builtin.apt:
    name:
      - mesa-va-drivers
    state: present
  when: amd_detected | bool and not nvidia_detected | bool

- name: Install yaVDR Media (e.g. Backgrounds)
  ansible.builtin.apt:
    name: yavdr-media

# - name: Command | write keyboard configuration to /etc/X11/xorg.conf.d/00-keyboard.conf
#   ansible.builtin.command: write-x11-keyboard-config
#   args:
#     creates: /etc/X11/xorg.conf.d/00-keyboard.conf
# NOTE: write-x11-keyboard-config is in the xlogin package
# Ubuntu's systemd is patched, so it does not create the file automatically

- name: Apt | install basic desktop programs
  ansible.builtin.apt:
    name:
      - xterm
      - kiosk-browser
    state: present
