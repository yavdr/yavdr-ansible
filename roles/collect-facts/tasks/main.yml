- name: Get information about usb and pci hardware and loaded kernel modules
  hardware_facts:
    usb: true
    pci: true
    serial: true
    modules: true
    gpus: true
    acpi_power_modes: true
  tags:
    - always

- name: Show collected hardware facts
  ansible.builtin.debug:
    msg: "{{ item }}"
    verbosity: 0
  loop:
    - "{{ ansible_facts.usb }}"
    - "{{ ansible_facts.pci }}"
    - "{{ ansible_facts.serial_ports }}"
    - "{{ ansible_facts.gpus }}"
    - "{{ ansible_facts.modules }}"
    - "{{ ansible_facts.acpi_power_modes }}"
    - "{{ ansible_facts.nvidia_detected }}"
    - "{{ ansible_facts.intel_detected }}"
    - "{{ ansible_facts.amd_detected }}"
    - "{{ ansible_facts.virtualbox_detected }}"

- name: Get detailed PCI device information
  pci_facts:
  tags:
    - always

- name: Show PCI devices
  ansible.builtin.debug:
    var: ansible_facts.pci_devices
    verbosity: 1

- name: Set known vdr output plugins
  ansible.builtin.set_fact:
    vdr_output_plugins:
      - softhddevice
      - xineliboutput
      - xine
