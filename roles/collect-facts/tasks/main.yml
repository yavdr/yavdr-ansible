- name: Get information about usb and pci hardware and loaded kernel modules
  hardware_facts:
    usb: true
    pci: true
    serial: true
    modules: true
    gpus: true
    acpi_power_modes: true
  tags:
    - always

- name: Show collected hardware facts
  ansible.builtin.debug:
    msg: "{{ item }}"
    verbosity: 1
  loop:
    - 'usb: {{ ansible_facts["usb"] }}'
    - 'pci: {{ ansible_facts["pci"] }}'
    - 'serial: {{ ansible_facts["serial_ports"] }}'
    - 'gpus: {{ ansible_facts["gpus"] }}'
    - 'modules: {{ ansible_facts["modules"] }}'
    - 'acpi_power_modes: {{ ansible_facts["acpi_power_modes"] }}'
    - 'nvidia_detected: {{ ansible_facts["nvidia_detected"] }}'
    - 'intel_detected: {{ ansible_facts["intel_detected"] }}'
    - 'amd_detected: {{ ansible_facts["amd_detected"] }}'
    - 'virtualbox_detected: {{ ansible_facts["virtualbox_detected"] }}'

- name: Get detailed PCI device information
  pci_facts:
  tags:
    - always

- name: Show PCI devices
  ansible.builtin.debug:
    var: ansible_facts["pci_devices"]
    verbosity: 1

- name: Set known vdr output plugins
  ansible.builtin.set_fact:
    vdr_output_plugins:
      - softhddevice
      - xineliboutput
      - xine

- name: Show ansible_facts
  debug:
    var: ansible_facts
    verbosity: 1
