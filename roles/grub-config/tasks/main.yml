---

- name: Custom grub configuration for timeout and reboot halt
  ansible.builtin.template:
    src: templates/50_custom.j2
    dest: /etc/grub.d/50_custom
    mode: '0775'
  notify: ['Update GRUB']

- name: Debug grub cmdline kms_boot_options
  ansible.builtin.debug:
    var: kms_boot_options
    verbosity: 0

- name: Debug grub.boot_options
  ansible.builtin.debug:
    var: grub.boot_options
    verbosity: 0

# TODO: add special case if plymouth is used
- name: Let the system boot quietly
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    state: present
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")'
    line: '\1{{ grub.boot_options }} {{ kms_boot_options }}"'
    backrefs: true
  notify: ['Update GRUB']

- name: Set GRUB_TIMEOUT
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    state: present
    regexp: '^(GRUB_TIMEOUT=)'
    line: 'GRUB_TIMEOUT={{ grub.timeout }}'
    backrefs: true
  notify: ['Update GRUB']

- name: Set GRUB_TIMEOUT_STYLE
  ansible.builtin.lineinfile:
    dest: /etc/default/grub
    state: present
    regexp: '^(GRUB_TIMEOUT_STYLE=)'
    line: '\1{{ "hidden" if grub.timeout == 0 else "menu" }}'
    backrefs: true
  notify: ['Update GRUB']
