- name: Update display_outputs and display_config variables with values from local facts if needed
  ansible.builtin.set_fact:
    ansible_facts:
      display_outputs: "{{ ansible_local.display_output.display_outputs }}"
      monitor_config: "{{ ansible_local.display_config.display_config }}"
  when:
    - ansible_facts.display_outputs is undefined
    - ansible_facts.display_config is undefined

# TODO: expand template for xorg.conf (or snippets)
#       with respect for the available graphics card driver
#       nvidia, noveau, intel, radeon

- name: check for /etc/yavdr/display_config.yml
  ansible.builtin.stat:
    path: /etc/yavdr/display_config.yml
  register: _custom_display_config_stat

- name: Load configuration if it exists
  when: _custom_display_config_stat.stat.exists and _custom_display_config_stat.stat.isreg
  block:
    - name: Slurp /etc/yavdr/display_config.yml
      ansible.builtin.slurp:
        src: /etc/yavdr/display_config.yml
      register: _custom_display_config

    - name: Load display configuration
      ansible.builtin.set_fact:
        custom_display_config: "{{ _custom_display_config.content | b64decode | from_yaml }}"

- name: Fallback if there is no custom display config
  ansible.builtin.set_fact:
    custom_display_config: "{{ ansible_local.display_config }}"
  when:
    - custom_display_config is undefined

- name: Show display_config facts
  ansible.builtin.debug:
    var: ansible_facts.display_config
    verbosity: 0

- name: Show display_outputs
  ansible.builtin.debug:
    var: ansible_facts.display_outputs
    verbosity: 0

- name: Show custom_display_config
  ansible.builtin.debug:
    var: custom_display_config
    verbosity: 0

# - name: Show xrandr config
#   ansible.builtin.debug:
#     var: xrandr
#     verbosity: 0

- name: Nvidia related config
  when:
    - ansible_facts.nvidia_detected | bool
  block:
    - name: Create xorg.conf (for nvidia driver)
      ansible.builtin.template:
        src: templates/xorg.conf.j2
        dest: /etc/X11/xorg.conf
        backup: true
        mode: "0644"

