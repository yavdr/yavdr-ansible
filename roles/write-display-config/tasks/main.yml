- name: Intel xorg config snippet
  ansible.builtin.template:
    src: templates/20-intel.conf.j2
    dest: /etc/X11/xorg.conf.d/20-intel.conf
    mode: "0644"
  when:
    - intel_detected | bool and not nvidia_detected | bool

- name: Amd xorg config snippet
  ansible.builtin.template:
    src: templates/20-amd.conf.j2
    dest: /etc/X11/xorg.conf.d/20-amd.conf
    mode: "0644"
  when:
    - amd_detected | bool and not nvidia_detected | bool

- name: Amd xorg config snippet for virtualbox
  ansible.builtin.template:
    src: templates/20-modesetting.conf.j2
    dest: /etc/X11/xorg.conf.d/20-modesetting.conf
    mode: "0644"
  when:
    - virtualbox_detected | bool

# configure language settings of the X server
- name: Source keyboard settings
  ansible.builtin.command: |
    python3 -c "from dotenv import dotenv_values; import json; print(json.dumps(dotenv_values('/etc/default/keyboard')))"
  register: keyboard_settings_content
  changed_when: false

- name: Set facts from sourced environment
  ansible.builtin.set_fact:
    keyboard_facts: "{{ (keyboard_settings_content.stdout | from_json) }}"
    # XKBMODEL: "{{ (sourced_env.stdout | from_json).XKBMODEL }}"
    # XKBLAYOUT: "{{ (sourced_env.stdout | from_json).XKBLEAYOUT }}"
    # XKBVARIANT: "{{ (sourced_env.stdout | from_json).XKBVARIANT }}"
    # XKBOPTIONS: "{{ (sourced_env.stdout | from_json).XKBOPTIONS }}"
    # BACKSPACE: "{{ (sourced_env.stdout | from_json).BACKSPACE }}"

- name: Show keyboard_facts
  ansible.builtin.debug:
    var: keyboard_facts
    verbosity: 0

- name: Write keyboard config for xorg
  ansible.builtin.template:
    src: templates/00-keyboard.conf.j2
    dest: /etc/X11/xorg.conf.d/00-keyboard.conf
    mode: "0644"

- name: Server flags config snippet to disable screen blanking
  ansible.builtin.template:
    src: templates/10-serverflags.conf.j2
    dest: /etc/X11/xorg.conf.d/10-serverflags.conf
    mode: "0644"

- name: Add snippet to ignore eventlircd devices in xorg
  ansible.builtin.template:
    src: templates/xorg-ignore-eventlircd.conf.j2
    dest: /etc/X11/xorg.conf.d/40-ignore-eventlircd.conf
    mode: "0644"
