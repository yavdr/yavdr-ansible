---
- name: Apt | install pulseaudio, pavucontrol and vdr-plugin-pulsecontrol
  ansible.builtin.apt:
    name:
      - alsa-base
      - alsa-utils
      - pulseaudio
      - pavucontrol
      - vdr-plugin-pulsecontrol
      - python3-pulsectl
      - python3-dasbus
      - yavdr-pasuspend
      - yavdr-pulse-dbusctl
    state: present
    install_recommends: false

- name: Ensure /var/lib/vdr/plugins/pulsecontrol/ exists
  ansible.builtin.file:
    name: /var/lib/vdr/plugins/pulsecontrol
    state: directory
    owner: "{{ vdr.user }}"
    group: "{{ vdr.group }}"
    mode: "0755"

- name: Create /var/lib/vdr/plugins/pulsecontrol/startup.script
  ansible.builtin.file:
    name: /var/lib/vdr/plugins/pulsecontrol/startup.script
    state: touch
    mode: "0755"

- name: Create /etc/asound.conf with pulseaudio as default device
  ansible.builtin.template:
    src: templates/alsa/asound.conf.j2
    dest: /etc/asound.conf
    mode: "0644"

- name: "Create/Update /etc/dbus-1/system.d/org.yavdr.dbus_pulse_ctl.conf to configure access to dbus_pulsectl"
  ansible.builtin.template:
    src: "dbus_pulsectl/org.yavdr.dbus_pulsectl.conf.j2"
    dest: "/etc/dbus-1/system.d/org.yavdr.dbus_pulse_ctl.conf"
    mode: "0644"

- name: Ensure ~/bin exists for vdr user
  ansible.builtin.file:
    path: "{{ vdr.home }}/bin"
    owner: "{{ vdr.user }}"
    group: "{{ vdr.group }}"
    state: directory
    mode: "0755"

- name: Ensure ~/.config/systemd/user exists for vdr user
  ansible.builtin.file:
    path: "{{ vdr.home }}/.config/systemd/user"
    state: directory
    owner: "{{ vdr.user }}"
    group: "{{ vdr.group }}"
    mode: "0755"
    # TODO: better way to enable unit than in openbox autostart set by yavdr-desktop?

- name: Avoid resampling
  ansible.builtin.lineinfile:
    path: /etc/pulse/daemon.conf
    regexp: "(; )?{{ item.split()[0] }} =.*"
    line: "{{ item }}"
  loop:
    - "resample-method = speex-float-10"
    - "default-sample-format = float32ne"
    - "avoid-resampling = yes"
    - "default-sample-rate = 48000"
    - "alternate-sample-rate = 44100"
